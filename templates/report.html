{% extends "base.html" %}

{% block content %}

<h1>Activity Report</h1>

<div class="report">

    <div class="report-box">
        <h2>{{ total_users }}</h2>
        <p>Total Users</p>
    </div>

    <div class="report-box">
        <h2>{{ total_activities }}</h2>
        <p>Total Activities</p>
    </div>

    <div class="report-box">
        <h2>{{ completed }}</h2>
        <p>Completed</p>
    </div>

    <div class="report-box">
        <h2>{{ pending }}</h2>
        <p>Pending</p>
    </div>

    <div class="report-box">
        <h2>{{ in_progress }}</h2>
        <p>In Progress</p>
    </div>

</div>

{% endblock %}
