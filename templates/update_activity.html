{% extends "base.html" %}

{% block content %}

<h1>Update Activity</h1>

<form method="POST">

    <label>Activity Name</label>

    <input type="text"
           name="activity_name"
           value="{{ activity.ActivityName }}"
           required>


    <label>Date</label>

    <input type="date"
           name="activity_date"
           value="{{ activity.ActivityDate }}"
           required>


    <label>Type</label>

    <input type="text"
           name="activity_type"
           value="{{ activity.ActivityType }}"
           required>

    <label>Status</label>

    <select name="status">

        <option value="Pending"
            {% if activity.Status = "Pending" %}
                selected
            {% endif %}>
            Pending
        </option>

        <option value="In Progress"
            {% if activity.Status = "In Progress" %}
                selected
            {% endif %}>
            In Progress
        </option>

        <option value="Completed"
            {% if activity.Status = "Completed" %}
                selected
            {% endif %}>
            Completed
        </option>

    </select>


    <label>Assigned User</label>

    <select name="user_id">

        {% for user in users %}

        <option value="{{ user.UserID }}"
            {% if user.UserID = activity.UserID %}
                selected
            {% endif %}>

            {{ user.Name }}

        </option>

        {% endfor %}

    </select>


    <button type="submit">
        Update Activity
    </button>

</form>

{% endblock %}
