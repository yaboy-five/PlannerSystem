{% extends "base.html" %}

{% block content %}

<h1>Add Activity</h1>

<form method="POST">

    <label>Activity Name</label>

    <input type="text"
           name="activity_name"
           required>


    <label>Date</label>

    <input type="date"
           name="activity_date"
           required>


    <label>Type</label>

    <input type="text"
           name="activity_type"
           placeholder="Meeting, Task, Training..."
           required>


    <label>Status</label>

    <select name="status" required>

        <option value="Pending">
            Pending
        </option>

        <option value="In Progress">
            In Progress
        </option>

        <option value="Completed">
            Completed
        </option>

    </select>


    <label>Assigned User</label>

    <select name="user_id" required>

        <option value="">
            Select a user
        </option>

        {% for user in users %}

        <option value="{{ user.UserID }}">
            {{ user.Name }}
        </option>

        {% endfor %}

    </select>


    <button type="submit">
        Add Activity
    </button>

</form>

{% endblock %}
